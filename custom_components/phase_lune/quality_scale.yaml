# DRAFT ONLY - custom HACS self-audit, not an official Home Assistant tier.
# Evidence ref: XAV59213/phase_lune@38e8a983ac4beb1a9a658235985104490ccbbbe7
# File/line references are relative to that ref. Higher-tier todo may mean not audited.
# Do not add quality_scale: bronze to manifest.json. See AUDIT.md.
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: "No integration actions are registered; __init__.py:19-44 and sensor.py:66-198."
  appropriate-polling:
    status: done
    comment: "sensor.py:16 uses 15 minutes for slowly changing, locally calculated lunar data; update at 85-86."
  brands:
    status: done
    comment: "Custom-integration mechanism since HA 2026.3: brand/ folder (icon, icon@2x, dark_icon(s), logo, logo@2x) per home-assistant/brands README and contributors blog 2026-02-24 (custom_integrations/ is legacy, no submission). Sizes/trim checked in tests/test_reconfigure_diag_icons.py::test_brand_assets_spec. Limitation: HA < 2026.3 does not show local brand images."
  common-modules:
    status: done
    comment: "Base entity PhaseLuneEntity in entity.py (shared by 4 sensors); pure calculation in calc.py/astro.py. No coordinator (no data fetching)."
  config-flow-test-coverage:
    status: done
    comment: "tests/test_config_flow.py covers user flow, default country, singleton abort and options flow with reload; config_flow.py 100% line+branch coverage. tests/ run with pytest-homeassistant-custom-component (HA 2026.10.4, Python 3.14) in .github/workflows/pytest.yml."
  config-flow:
    status: done
    comment: "SelectSelector with translated options, data_description FR/EN (strings.json, translations/*), country stored in ConfigEntry.options (legacy data fallback tested). tests/test_config_flow.py."
  dependency-transparency:
    status: exempt
    comment: "manifest.json requirements is empty; only Home Assistant and Python standard library imports in audited Python modules."
  docs-actions:
    status: exempt
    comment: "Integration exposes no integration-specific actions."
  docs-conditions:
    status: exempt
    comment: "Integration exposes no integration-specific conditions."
  docs-high-level-description:
    status: done
    comment: "README.md:125 describes the local lunar phase and illumination calculations, without an API."
  docs-installation-instructions:
    status: done
    comment: "README FR/EN Installation (HACS + manual) with prerequisites (HA >= 2024.12, HACS); docs/Installation.{fr,en}.md."
  docs-removal-instructions:
    status: done
    comment: "README.md (FR+EN 'Suppression'/'Removal') and docs/Installation.{fr,en}.md describe entry deletion and optional HACS removal."
  docs-triggers:
    status: exempt
    comment: "Integration exposes no integration-specific triggers."
  entity-event-setup:
    status: exempt
    comment: "Sensors poll and do not subscribe to events. Entry update listener is registered with async_on_unload in __init__.py:34."
  entity-unique-id:
    status: done
    comment: "Four stable unique IDs in sensor.py:112,134,159,180; singleton enforced by config_flow.py:26-27."
  has-entity-name:
    status: done
    comment: "sensor.py:73 sets has_entity_name=True; device name at 80-83 and translation keys at 111,133,158,179; strings.json:18-32 contains names."
  runtime-data:
    status: exempt
    comment: "No per-entry API client or coordinator/runtime object is shared. Entity-local calculated state stays on entities; hass.data in __init__.py:21-25 only guards global frontend registration."
  test-before-configure:
    status: exempt
    comment: "Only local calculations; country selects image hemisphere, not a connection to a device/service."
  test-before-setup:
    status: exempt
    comment: "Only local calculations, explicitly allowed by this rule; __init__.py:31-35 forwards sensor setup and sensor.py:23-63 computes locally."
  unique-config-entry:
    status: done
    comment: "config_flow.py:26-27 sets DOMAIN as unique ID and aborts when already configured."

  # Silver
  action-exceptions:
    status: exempt
    comment: "No custom service actions; only sensor platform (rule exception)."
  config-entry-unloading:
    status: done
    comment: "async_unload_entry unloads platforms and the update listener is removed via async_on_unload; tests/test_init_sensor.py::test_setup_unload_reload asserts LOADED → reload → NOT_LOADED. Global JS/static paths persist intentionally."
  docs-configuration-parameters:
    status: done
    comment: "Options flow (Configure → Country, automatic reload) documented in README.md FR+EN and docs/Installation.{fr,en}.md."
  docs-installation-parameters:
    status: done
    comment: "README.md and docs/Installation.{fr,en}.md document the single Country parameter (default France, hemisphere) at setup."
  entity-unavailable:
    status: done
    comment: "entity.py update(): unexpected computation error sets available=False, recovers on next success. tests/test_robustness.py::test_unavailable_logged_once_then_recovers."
  integration-owner:
    status: done
    comment: "manifest.json:4-6 lists @xav59213 as codeowner."
  log-when-unavailable:
    status: done
    comment: "entity.py logs once at info when becoming unavailable and once when recovered; asserted in tests/test_robustness.py (count per entity)."
  parallel-updates:
    status: done
    comment: "sensor.py PARALLEL_UPDATES = 0 (local computation, no device/service to protect); asserted in tests/test_robustness.py."
  reauthentication-flow:
    status: exempt
    comment: "No credentials or external authentication are used."
  test-coverage:
    status: done
    comment: "100% line+branch coverage for every module; tools/check_coverage.py fails the Pytest workflow if any module is <= 95% (written; verified locally incl. a failing threshold)."

  # Gold
  devices:
    status: done
    comment: "entity.py DeviceInfo: identifiers, name, manufacturer, model, sw_version, entry_type=SERVICE; asserted in tests/test_robustness.py."
  diagnostics:
    status: done
    comment: "diagnostics.py: version, country, hemisphere, legacy flag, redacted options, anecdote count, calculation status; no entry_id/unique_id/title/coordinates (asserted in tests via get_diagnostics_for_config_entry); error path tested."
  discovery-update-info:
    status: exempt
    comment: "No device or network service to discover (rule exception)."
  discovery:
    status: exempt
    comment: "No device or network service to discover (rule exception)."
  docs-data-update:
    status: done
    comment: "README FR/EN 'Mise à jour des données'/'Data updates': local computation every 15 min, unavailable/recovery behaviour."
  docs-examples:
    status: done
    comment: "README FR/EN automation examples (full-moon notification, illumination-based lighting) and Lovelace card examples."
  docs-known-limitations:
    status: done
    comment: "README.md 'Précision et limites'/'Accuracy and limitations' and docs/PRECISION.md: USNO-checked accuracy, quarter window, equivalent age_days, leap-day anecdote, validity range."
  docs-supported-devices:
    status: exempt
    comment: "Does not connect to any device or service and integrates no physical device (rule exception)."
  docs-supported-functions:
    status: done
    comment: "README FR/EN 'Fonctions prises en charge'/'Supported functions': 4 sensors, attributes, card, no actions."
  docs-troubleshooting:
    status: done
    comment: "README FR/EN 'Dépannage'/'Troubleshooting': cache, image path, mirrored image, unavailable sensors, phase window."
  docs-use-cases:
    status: done
    comment: "README FR/EN 'Cas d'usage'/'Use cases'."
  dynamic-devices:
    status: exempt
    comment: "Single static service device per config entry tied to its lifecycle (rule exception)."
  entity-category:
    status: exempt
    comment: "All 4 sensors are primary user-facing entities used by the card; default category appropriate (rule exception)."
  entity-device-class:
    status: done
    comment: "Phase slug sensor uses SensorDeviceClass.ENUM with 8 options and translated states; illumination (% lit) has no matching device class (illuminance is lux); French label and fact are free text."
  entity-disabled-by-default:
    status: exempt
    comment: "None of the 4 sensors is noisy (15-min local updates) and all feed the card (rule exception)."
  entity-translations:
    status: done
    comment: "All 4 sensors use translation_key with names in strings.json and translations/en.json, fr.json; slug states translated."
  exception-translations:
    status: exempt
    comment: "The integration raises no custom exceptions (rule exception)."
  icon-translations:
    status: todo
    comment: "icons.json covers slug (8 state icons), phase (default), illumination and anecdote; their icon properties were removed (tested). The French-label phase sensor keeps a dynamic icon property: its states ('Pleine lune'…) are rejected as icons.json state keys by hassfest ([a-z0-9-_]+, verified locally). Full compliance needs changing that sensor's state values (breaking automations/card) - owner decision."
  reconfiguration-flow:
    status: done
    comment: "config_flow.py async_step_reconfigure (country, _get_reconfigure_entry, async_update_reload_and_abort; legacy data cleaned into options). tests/test_reconfigure_diag_icons.py: options and legacy entries, single entry kept, stable entity ids, reload, unknown entry rejected."
  repair-issues:
    status: exempt
    comment: "No situation requiring user repair (no credentials, network, or deprecated config) (rule exception)."
  stale-devices:
    status: exempt
    comment: "Single static service device per config entry tied to its lifecycle (rule exception)."

  # Platinum
  async-dependency:
    status: exempt
    comment: "No external requirements (manifest requirements: []) (rule exception)."
  inject-websession:
    status: exempt
    comment: "Makes no HTTP requests (rule exception)."
  strict-typing:
    status: done
    comment: "mypy --strict (mypy.ini; mypy 1.18.2 pinned in requirements_test*.txt) passes locally on all integration modules with 4 targeted ignores: 3 for voluptuous schemas (HA 2026.10 types expect probatio; voluptuous kept for HA >= 2024.12) and 1 for the StaticPathConfig re-export. Step added to .github/workflows/pytest.yml (written, not yet run remotely)."
